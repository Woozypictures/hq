name: build
on:
  push:
    branches: [main, design-glass-nav]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        env:
          HQ_KEYSTORE_B64: ${{ secrets.HQ_KEYSTORE_B64 }}
          HQ_KEYSTORE_PASS: ${{ secrets.HQ_KEYSTORE_PASS }}
        run: |
          echo "$HQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hq.jks"
          export HQ_KEYSTORE_PATH="$RUNNER_TEMP/hq.jks"
          set -o pipefail
          export VERSION_CODE=${{ github.run_number }}
          export VERSION_NAME=0.${{ github.run_number }}
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: HQ 0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/l
          cp build.log /tmp/l/build.log 2>/dev/null || echo "no log" > /tmp/l/build.log
          tail -c 60000 /tmp/l/build.log > /tmp/l/tail.log
          echo "${{ job.status }} run ${{ github.run_number }} sha ${{ github.sha }}" > /tmp/l/status.txt
          git config user.name hq-bot
          git config user.email hq-bot@users.noreply.github.com
          git checkout --orphan ${{ github.ref_name == 'main' && 'build-log' || 'build-log-design' }}
          git rm -rf -q . || true
          cp /tmp/l/tail.log build.log
          cp /tmp/l/status.txt status.txt
          git add build.log status.txt
          git commit -q -m "log ${{ github.run_number }}"
          git push -f origin HEAD:${{ github.ref_name == 'main' && 'build-log' || 'build-log-design' }}
