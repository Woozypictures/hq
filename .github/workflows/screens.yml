name: screens
# Installs debug builds of HQ and HQ Fit on an Android emulator (same debug key, so HQ can read HQ Fit's summary)
# and takes screenshots at phone size and at Galaxy Tab S9 Ultra landscape size. Results go to the screens-out branch.
on:
  push:
    branches: [screens]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Woozypictures/hq-fit
          path: fit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tail -40
          (cd fit && gradle :app:assembleDebug --no-daemon 2>&1 | tail -40)
          cp app/build/outputs/apk/debug/app-debug.apk hq.apk
          cp fit/app/build/outputs/apk/debug/app-debug.apk fit.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/screens.sh
      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p /tmp/s && cp -r out/. /tmp/s/ 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} sha ${{ github.sha }}" > /tmp/s/status.txt
          git config user.name hq-bot
          git config user.email hq-bot@users.noreply.github.com
          git checkout --orphan screens-out
          git rm -rf -q . || true
          rm -rf fit out hq.apk fit.apk
          cp -r /tmp/s/. .
          git add -A
          git commit -q -m "screens ${{ github.run_number }}"
          git push -f origin screens-out
